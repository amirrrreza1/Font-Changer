<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <style>
        :root {
            --bg-gradient: linear-gradient(135deg, #0f172a 0%, #1e1b4b 100%);
            --glass-bg: rgba(255, 255, 255, 0.05);
            --glass-border: rgba(255, 255, 255, 0.1);
            --glass-highlight: rgba(255, 255, 255, 0.2);
            --primary: #3b82f6;
            --primary-glow: 0 0 15px rgba(59, 130, 246, 0.5);
            --text-main: rgba(255, 255, 255, 0.95);
            --text-muted: rgba(255, 255, 255, 0.6);
        }

        body {
            width: 260px;
            padding: 24px;
            margin: 0;
            font-family: system-ui, -apple-system, sans-serif;
            background: var(--bg-gradient);
            color: var(--text-main);
        }

        h3 {
            margin: 0 0 24px 0;
            font-size: 18px;
            font-weight: 600;
            text-align: center;
            letter-spacing: 0.5px;
            text-shadow: 0 2px 4px rgba(0, 0, 0, 0.3);
        }

        .input-group {
            margin-bottom: 18px;
        }

        label {
            display: block;
            margin-bottom: 8px;
            font-size: 12px;
            font-weight: 500;
            color: var(--text-muted);
            text-transform: uppercase;
            letter-spacing: 0.5px;
        }

        select {
            width: 100%;
            padding: 12px 14px;
            font-size: 14px;
            color: var(--text-main);
            background-color: var(--glass-bg);
            border: 1px solid var(--glass-border);
            border-radius: 12px;
            outline: none;
            cursor: pointer;
            appearance: none;
            backdrop-filter: blur(10px);
            -webkit-backdrop-filter: blur(10px);
            transition: all 0.3s ease;

            background-image: url("data:image/svg+xml;charset=US-ASCII,%3Csvg%20xmlns%3D%22http%3A%2F%2Fwww.w3.org%2F2000%2Fsvg%22%20width%3D%22292.4%22%20height%3D%22292.4%22%3E%3Cpath%20fill%3D%22%23ffffff%22%20d%3D%22M287%2069.4a17.6%2017.6%200%200%200-13-5.4H18.4c-5%200-9.3%201.8-12.9%205.4A17.6%2017.6%200%200%200%200%2082.2c0%205%201.8%209.3%205.4%2012.9l128%20127.9c3.6%203.6%207.8%205.4%2012.8%205.4s9.2-1.8%2012.8-5.4L287%2095c3.5-3.5%205.4-7.8%205.4-12.8%200-5-1.9-9.2-5.5-12.8z%22%2F%3E%3C%2Fsvg%3E");
            background-repeat: no-repeat;
            background-position: right 14px top 50%;
            background-size: 10px auto;
        }

        select option {
            color: #0f172a;
            background: #ffffff;
        }

        select:hover,
        select:focus {
            border-color: var(--glass-highlight);
            background-color: rgba(255, 255, 255, 0.1);
            box-shadow: 0 4px 15px rgba(0, 0, 0, 0.2);
        }

        .button-group {
            display: grid;
            grid-template-columns: 1fr 1.5fr;
            gap: 12px;
            margin-top: 24px;
        }

        button {
            width: 100%;
            padding: 12px;
            cursor: pointer;
            border-radius: 12px;
            font-size: 13px;
            font-weight: 600;
            transition: all 0.3s cubic-bezier(0.4, 0, 0.2, 1);
            backdrop-filter: blur(10px);
            -webkit-backdrop-filter: blur(10px);
        }

        #reset-btn {
            background: var(--glass-bg);
            color: var(--text-main);
            border: 1px solid var(--glass-border);
        }

        #reset-btn:hover {
            background: rgba(255, 255, 255, 0.1);
            border-color: var(--glass-highlight);
        }

        #save-btn {
            background: var(--primary);
            color: white;
            border: 1px solid transparent;
            box-shadow: 0 4px 15px rgba(0, 0, 0, 0.2);
        }

        #save-btn:hover {
            background: #2563eb;
            box-shadow: var(--primary-glow);
            transform: translateY(-1px);
        }

        button:active {
            transform: scale(0.96);
        }

        #status {
            margin-top: 16px;
            font-size: 12px;
            font-weight: 500;
            color: #34d399;
            /* Mint green */
            text-align: center;
            display: none;
            background: rgba(52, 211, 153, 0.1);
            border: 1px solid rgba(52, 211, 153, 0.2);
            padding: 10px;
            border-radius: 8px;
            backdrop-filter: blur(4px);
        }
    </style>
</head>

<body>
    <h3>Font Splitter</h3>

    <div class="input-group">
        <label for="en-font">English Font</label>
        <select id="en-font">
            <option value="default">Default</option>
            <option value="JetBrainsMono.ttf">JetBrains Mono</option>
            <option value="IosevkaCharon.ttf">Iosevka Charon</option>
            <option value="RobotoCondensed.ttf">Roboto Condensed</option>
        </select>
    </div>

    <div class="input-group">
        <label for="fa-font">Persian Font</label>
        <select id="fa-font">
            <option value="default">Default</option>
            <option value="Shabnam.ttf">Shabnam</option>
            <option value="vazirmatn.ttf">Vazirmatn</option>
            <option value="IRANYekan.ttf">IRAN Yekan</option>
            <option value="Kalameh.ttf">Kalameh</option>
        </select>
    </div>

    <div class="button-group">
        <button id="reset-btn">Reset</button>
        <button id="save-btn">Save & Apply</button>
    </div>
    <div id="status">Saved!</div>

    <script src="popup.js"></script>
</body>

</html>
