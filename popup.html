<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <style>
        :root {
            --primary: #2563eb;
            --primary-hover: #1d4ed8;
            --bg-color: #ffffff;
            --text-main: #1e293b;
            --text-muted: #64748b;
            --border-color: #e2e8f0;
            --input-bg: #f8fafc;
        }

        body {
            width: 260px;
            padding: 20px;
            margin: 0;
            font-family: system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
            background: var(--bg-color);
            color: var(--text-main);
        }

        h3 {
            margin: 0 0 20px 0;
            font-size: 18px;
            font-weight: 600;
            text-align: center;
            letter-spacing: -0.5px;
        }

        .input-group {
            margin-bottom: 16px;
        }

        label {
            display: block;
            margin-bottom: 6px;
            font-size: 13px;
            font-weight: 500;
            color: var(--text-muted);
        }

        select {
            width: 100%;
            padding: 10px 12px;
            font-size: 14px;
            color: var(--text-main);
            background-color: var(--input-bg);
            border: 1px solid var(--border-color);
            border-radius: 8px;
            outline: none;
            cursor: pointer;
            appearance: none;
            background-repeat: no-repeat;
            background-position: right 12px top 50%;
            background-size: 10px auto;
            transition: all 0.2s ease;
        }

        select:hover,
        select:focus {
            border-color: var(--primary);
            background-color: #fff;
            box-shadow: 0 0 0 3px rgba(37, 99, 235, 0.1);
        }

        button {
            margin-top: 10px;
            width: 100%;
            padding: 12px;
            cursor: pointer;
            background: var(--primary);
            color: white;
            border: none;
            border-radius: 8px;
            font-size: 14px;
            font-weight: 600;
            transition: background 0.2s ease, transform 0.1s ease;
        }

        button:hover {
            background: var(--primary-hover);
        }

        button:active {
            transform: scale(0.98);
        }

        #status {
            margin-top: 12px;
            font-size: 13px;
            font-weight: 500;
            color: #16a34a;
            text-align: center;
            display: none;
            background: #dcfce7;
            padding: 8px;
            border-radius: 6px;
        }

        .button-group {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 10px;
            margin-top: 15px;
        }

        button {
            width: 100%;
            padding: 10px;
            cursor: pointer;
            border-radius: 8px;
            font-size: 13px;
            font-weight: 600;
            transition: all 0.2s ease;
        }

        #save-btn {
            background: var(--primary);
            color: white;
            border: none;
        }

        #save-btn:hover {
            background: var(--primary-hover);
        }

        #reset-btn {
            background: #fff;
            color: var(--text-main);
            border: 1px solid var(--border-color);
        }

        #reset-btn:hover {
            background: var(--input-bg);
            border-color: var(--text-muted);
        }

        button:active {
            transform: scale(0.98);
        }
    </style>
</head>

<body>
    <h3>Font Settings</h3>

    <div class="input-group">
        <label for="en-font">English Font</label>
        <select id="en-font">
            <option value="JetBrainsMono.ttf">JetBrains Mono</option>
            <option value="IosevkaCharon.ttf">Iosevka Charon</option>
            <option value="RobotoCondensed.ttf">Roboto Condensed</option>
        </select>
    </div>

    <div class="input-group">
        <label for="fa-font">Persian Font</label>
        <select id="fa-font">
            <option value="Shabnam.ttf">Shabnam</option>
            <option value="vazirmatn.ttf">Vazirmatn</option>
            <option value="IRANYekan.ttf">IRAN Yekan</option>
            <option value="Kalameh.ttf">Kalameh</option>
        </select>
    </div>

    <div class="button-group">
        <button id="reset-btn">Reset</button>
        <button id="save-btn">Save & Apply</button>
    </div>
    <div id="status">Saved!</div>

    <script src="popup.js"></script>
</body>

</html>
